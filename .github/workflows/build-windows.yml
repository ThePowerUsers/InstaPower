name: Build Veyra for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare webpack production bundle
        run: npm run package

      - name: Build Windows installer and portable executable
        run: npm run build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-Windows-Portable
          path: dist/*portable*.exe
          if-no-files-found: error

      - name: Publish Veyra v1.0.0 release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Veyra v1.0.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -ExpandProperty FullName
          if (-not $files) {
            throw "No Windows executable artifacts were produced."
          }
          gh release create "v1.0.0" $files --title "Veyra v1.0.0" --notes "Veyra v1.0.0 — Windows release.

Installer:
- Full setup wizard
- Choose the installation directory
- Start Menu shortcut
- Optional Desktop shortcut

Portable:
- Single executable
- No installation required
- Runs directly from a folder, USB drive, or other location

Veyra is an independent, unofficial Instagram desktop client and is not affiliated with or endorsed by Instagram or Meta." --latest
