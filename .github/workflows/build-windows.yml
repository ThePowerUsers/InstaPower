name: Build InstaPower for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Prepare production bundle
        run: npm run package

      - name: Locate Forge Windows package
        id: forge-package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path out -Directory |
            Where-Object { $_.Name -match 'win32-x64$' } |
            Select-Object -First 1

          if (-not $package) {
            Write-Error "Electron Forge did not produce a Windows x64 package under out/."
            Get-ChildItem -Path out -Force -ErrorAction SilentlyContinue | Format-Table -AutoSize
            exit 1
          }

          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using Forge package: $($package.FullName)"

      - name: Build installer and portable executable
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npx --yes electron-builder@26.15.3 --win nsis portable --prepackaged "${{ steps.forge-package.outputs.path }}" --publish never

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup*.exe' -File | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -Filter '*portable*.exe' -File | Select-Object -First 1

          if (-not $installer) {
            Write-Error "NSIS installer was not produced."
            exit 1
          }

          if (-not $portable) {
            Write-Error "Portable executable was not produced."
            exit 1
          }

          Write-Host "Installer: $($installer.Name)"
          Write-Host "Portable: $($portable.Name)"

      - name: Upload installer for SignPath
        id: upload-installer-signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: dist/*Setup*.exe
          archive: false
          if-no-files-found: error

      - name: Submit installer signing request to SignPath
        if: ${{ steps.upload-installer-signpath.outcome == 'success' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-installer-signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signpath-installer
          skip-decompress: true

      - name: Replace installer with SignPath-signed artifact
        if: ${{ steps.upload-installer-signpath.outcome == 'success' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "${{ runner.temp }}\signpath-installer" -Filter '*.exe' -File | Select-Object -First 1
          if (-not $signed) {
            Write-Error "SignPath did not return a signed installer executable."
            exit 1
          }
          $target = Get-ChildItem -Path dist -Filter '*Setup*.exe' -File | Select-Object -First 1
          Copy-Item -Path $signed.FullName -Destination $target.FullName -Force

      - name: Upload portable for SignPath
        id: upload-portable-signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: dist/*portable*.exe
          archive: false
          if-no-files-found: error

      - name: Submit portable signing request to SignPath
        if: ${{ steps.upload-portable-signpath.outcome == 'success' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-portable-signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signpath-portable
          skip-decompress: true
          parameters: |
            version: "${{ github.ref_name }}"

      - name: Replace portable with SignPath-signed artifact
        if: ${{ steps.upload-portable-signpath.outcome == 'success' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "${{ runner.temp }}\signpath-portable" -Filter '*.exe' -File | Select-Object -First 1
          if (-not $signed) {
            Write-Error "SignPath did not return a signed portable executable."
            exit 1
          }
          $target = Get-ChildItem -Path dist -Filter '*portable*.exe' -File | Select-Object -First 1
          Copy-Item -Path $signed.FullName -Destination $target.FullName -Force

      - name: Verify Authenticode signing status
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: |
          $executables = Get-ChildItem -Path dist -Filter '*.exe' -File |
            Where-Object { $_.Name -match 'Setup|portable' }

          foreach ($exe in $executables) {
            $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"

            if ($env:SIGNPATH_ENABLED -eq 'true') {
              if ($signature.Status -ne 'Valid') {
                Write-Error "Expected a valid Authenticode signature for $($exe.Name), but got $($signature.Status)."
                exit 1
              }
              if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
                Write-Error "Expected a SignPath Foundation signature for $($exe.Name), but got $($signature.SignerCertificate.Subject)."
                exit 1
              }
            } else {
              Write-Warning "SignPath is not configured yet; this build is unsigned and Windows may show Unknown Publisher."
            }
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -Filter '*.exe' -File |
            Where-Object { $_.Name -match 'Setup|portable' } |
            Sort-Object Name

          if (-not $artifacts) {
            Write-Error "No Windows executables were found for checksum generation."
            exit 1
          }

          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Path $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }

          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*Setup*.exe'

      - name: Attest portable provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*portable*.exe'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: InstaPower-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: InstaPower-Windows-Portable
          path: dist/*portable*.exe
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: InstaPower-Windows-SHA256
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release InstaPower v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $message = '${{ github.event.head_commit.message }}'
          if ($message -notmatch '^Release InstaPower (v[0-9]+[.][0-9]+[.][0-9]+)') {
            Write-Error "Release commit message must start with 'Release InstaPower vMAJOR.MINOR.PATCH'."
            exit 1
          }

          $tag = $Matches[1]
          $title = "InstaPower $tag"
          $notes = @"
          InstaPower $tag — Windows release.

          Assets:
          - InstaPower-$($tag.TrimStart('v'))-Setup-x64.exe: Windows setup wizard.
          - InstaPower-$($tag.TrimStart('v'))-portable-x64.exe: no-install portable build.
          - SHA256SUMS.txt: SHA-256 checksums for both Windows executables.

          Build provenance attestations are generated for the Windows executables.
          Code signing is provided through SignPath Foundation when enabled for the project.

          InstaPower is an independent, unofficial Instagram desktop client and is not affiliated with or endorsed by Instagram or Meta.
          "@

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/*.exe dist/SHA256SUMS.txt --title $title --latest --notes $notes
          }
