name: Build InstaPower for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Generate dependency SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          npm sbom --package-lock-only --sbom-format cyclonedx | Set-Content -Path dist/SBOM.cdx.json -Encoding utf8

      - name: Prepare production bundle
        run: npm run package

      - name: Locate Forge Windows package
        id: forge-package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path out -Directory |
            Where-Object { $_.Name -match 'win32-x64$' } |
            Select-Object -First 1

          if (-not $package) {
            Write-Error "Electron Forge did not produce a Windows x64 package under out/."
            Get-ChildItem -Path out -Force -ErrorAction SilentlyContinue | Format-Table -AutoSize
            exit 1
          }

          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using Forge package: $($package.FullName)"

      - name: Build installer and portable executable
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npx --yes electron-builder@26.15.3 --win nsis portable --prepackaged "${{ steps.forge-package.outputs.path }}" --publish never

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup*.exe' -File
          $portable = Get-ChildItem -Path dist -Filter '*portable*.exe' -File

          if (-not $installer) {
            Write-Error "NSIS installer was not produced."
            exit 1
          }

          if (-not $portable) {
            Write-Error "Portable executable was not produced."
            exit 1
          }

          Write-Host "Installer:"
          $installer | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "Portable:"
          $portable | Select-Object Name, Length | Format-Table -AutoSize

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -Filter '*.exe' -File |
            Where-Object { $_.Name -match 'Setup|portable' } |
            Sort-Object Name

          if (-not $artifacts) {
            Write-Error "No Windows executables were found for checksum generation."
            exit 1
          }

          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Path $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }

          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*Setup*.exe'

      - name: Attest portable provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*portable*.exe'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-Portable
          path: dist/*portable*.exe
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-SHA256
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-SBOM
          path: dist/SBOM.cdx.json
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release InstaPower v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $message = '${{ github.event.head_commit.message }}'
          if ($message -notmatch '^Release InstaPower (v[0-9]+[.][0-9]+[.][0-9]+)') {
            Write-Error "Release commit message must start with 'Release InstaPower vMAJOR.MINOR.PATCH'."
            exit 1
          }

          $tag = $Matches[1]
          $title = "InstaPower $tag"
          $notes = @"
          InstaPower $tag — Windows release.

          Assets:
          - Installer: setup wizard with selectable install directory.
          - Portable: standalone executable with no installation.
          - SHA256SUMS.txt: SHA-256 checksums for both Windows executables.
          - SBOM.cdx.json: CycloneDX dependency inventory for the build.

          Build provenance attestations are generated for the Windows executables.

          InstaPower is an independent, unofficial Instagram desktop client and is not affiliated with or endorsed by Instagram or Meta.
          "@

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.exe dist/SHA256SUMS.txt dist/SBOM.cdx.json --clobber
          } else {
            gh release create $tag dist/*.exe dist/SHA256SUMS.txt dist/SBOM.cdx.json --title $title --latest --notes $notes
          }
