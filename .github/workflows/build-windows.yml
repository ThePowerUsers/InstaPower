name: Build InstaPower for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare production bundle
        run: npm run package
      - name: Build installer and portable executable
        run: npm run build:windows
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPower-Windows-Portable
          path: dist/*portable*.exe
          if-no-files-found: error
      - name: Publish v1.0.0 release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release InstaPower v1.0.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.exe --clobber
          } else {
            gh release create $tag dist/*.exe --title 'InstaPower v1.0.0' --latest --notes 'InstaPower v1.0.0 — Windows release. Installer: setup wizard with selectable install directory. Portable: standalone executable with no installation. InstaPower is an independent, unofficial Instagram desktop client and is not affiliated with or endorsed by Instagram or Meta.'
          }
