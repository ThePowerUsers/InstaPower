name: One-time release maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check maintenance commit
        id: check
        shell: bash
        run: |
          message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
          if [[ "$message" != "ADMIN: delete superseded v1.1.0" ]]; then
            echo "run_cleanup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_cleanup=true" >> "$GITHUB_OUTPUT"

      - name: Delete superseded release and tag
        if: steps.check.outputs.run_cleanup == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.1.0 --repo "${{ github.repository }}" --cleanup-tag --yes

      - name: Remove one-time workflow and marker
        if: steps.check.outputs.run_cleanup == 'true'
        uses: actions/checkout@v5

      - name: Commit maintenance cleanup
        if: steps.check.outputs.run_cleanup == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v1.1.0.yml docs/.release-cleanup-marker
          git commit -m "chore: remove one-time release maintenance"
          git push
