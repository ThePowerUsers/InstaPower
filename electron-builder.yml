appId: com.thepowerusers.instapower
productName: InstaPower

# Electron Forge keeps .webpack/main as its package entry directory.
# electron-builder needs the concrete bundled entry file.
extraMetadata:
  main: .webpack/main/index.js
directories:
  output: dist

# Ship only the production bundle. Everything else stays out.
files:
  - .webpack/**/*

# Maximum compression for the packaged app.
asar: true
compression: maximum

# Avoid shipping unnecessary package scripts and metadata.
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: InstaPower
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
