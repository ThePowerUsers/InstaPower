appId: com.thepowerusers.instapower
productName: InstaPower
publisherName: ThePowerUsers
copyright: Copyright © 2026 ThePowerUsers

# Electron Forge creates the fully bundled Windows app in out/*-win32-x64.
# The Windows workflow passes that prepackaged directory to electron-builder.
directories:
  output: dist

asar: true
compression: maximum
removePackageScripts: true
removePackageKeywords: true
electronLanguages:
  - en-US
  - en

win:
  icon: build/icon.svg
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  # Authenticode signing is automatic when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # are available in CI. Keep unsigned local builds usable while credentials are absent.
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: InstaPower
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
  useZip: true
