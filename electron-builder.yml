appId: com.thepowerusers.instapower
productName: InstaPower

# Electron Forge creates the fully bundled Windows app in out/*-win32-x64.
# The Windows workflow passes that prepackaged directory to electron-builder.
directories:
  output: dist

asar: true
compression: maximum
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: InstaPower
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
