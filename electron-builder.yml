appId: com.thepowerusers.instapower
productName: InstaPower
directories:
  output: dist

# Ship only the production bundle and package metadata. Everything else stays out.
files:
  - .webpack/**/*

# Maximum compression for the packaged app.
asar: true
compression: maximum

# Avoid shipping unnecessary source maps and development metadata.
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: InstaPower
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  compression: maximum

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
